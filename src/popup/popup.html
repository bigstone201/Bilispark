<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiliSpark - B站体验优化箱</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<!-- 顶部标题栏 -->
<header>
  <div class="header-left">
    <div class="logo-badge">⚡</div>
    <div class="header-titles">
      <span class="app-title">BiliSpark</span>
      <span class="app-sub">B站体验优化箱</span>
    </div>
  </div>
</header>

<!-- 导航控制栏：左侧切换页面，右侧当前页设置按钮 -->
<div class="nav-bar">
  <nav class="nav-tabs" role="tablist">
    <button id="tabSpeed" class="tab-btn active" role="tab" aria-selected="true">
      <span class="tab-icon">⚡</span>
      <span class="tab-label">倍速</span>
    </button>
    <button id="tabGesture" class="tab-btn" role="tab" aria-selected="false">
      <span class="tab-icon">🎯</span>
      <span class="tab-label">手势</span>
    </button>
  </nav>

  <!-- 当前页面设置按钮 -->
  <button id="settingBtn" class="icon-btn" title="倍速设置" aria-label="设置">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
    </svg>
  </button>
</div>

<main>
  <!-- ==========================================
       页面一：倍速管理 (Speed View)
       ========================================== -->
  <div id="speedView" class="tab-content active">
    <!-- 快捷标签卡片 -->
    <div class="card">
      <div class="section-title">
        <span>快捷添加</span>
        <span class="subtitle">点击常用档位速加</span>
      </div>
      <div class="quick-tags" id="quickAddContainer">
        <!-- JS 动态生成 -->
      </div>

      <div class="input-group">
        <input type="number" id="speedInput" step="0.1" min="0.1" max="16.0" placeholder="自定义倍速 (0.1 - 16.0)">
        <button id="addBtn" class="action-btn">添加</button>
      </div>
    </div>

    <!-- 当前倍速列表卡片 -->
    <div class="card">
      <div class="section-title">
        <span>当前倍速列表</span>
        <span class="subtitle">点击右上角 × 删除</span>
      </div>
      <div class="speed-list-container">
        <div class="speed-list" id="speedList">
          <!-- JS 动态生成 -->
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================
       页面一的高级设置：倍速设置 (Speed Settings View)
       ========================================== -->
  <div id="speedSettingsView" class="tab-content hidden">
    <div class="view-header">
      <button id="backFromSettingsBtn" class="back-link" title="返回倍速列表">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
        <span>返回倍速管理</span>
      </button>
      <span class="view-subtitle">高级选项</span>
    </div>

    <!-- 音频优化设置卡片 -->
    <div class="card">
      <div class="setting-item no-border">
        <div class="setting-info">
          <div class="setting-label">
            启用“花栗鼠”音效
            <div class="tooltip-icon">?
              <span class="tooltip-text">倍速 ≥ 7.0x 时自动关闭音调保真，避免超高倍速下浏览器音频解码瓶颈带来的卡顿或破音。</span>
            </div>
          </div>
          <div class="setting-desc">极速模式下保障播放流畅与低功耗</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="chipmunkToggle" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- ==========================================
       页面二：手势管理 (Gesture View，与倍速同级)
       ========================================== -->
  <div id="gestureView" class="tab-content hidden">
    <!-- 手势滑动开关卡片 -->
    <div class="card">
      <div class="setting-item no-border">
        <div class="setting-info">
          <div class="setting-label">启用手势滑动</div>
          <div class="setting-desc">按住鼠标左键左右拖动调节播放进度</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="gestureToggle" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <!-- 长按加速卡片 -->
    <div class="card">
      <div class="setting-item">
        <div class="setting-info">
          <div class="setting-label">鼠标左键长按画面加速</div>
          <div class="setting-desc">在视频画面内长按左键触发临时加速</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="mouseLongPressToggle" checked>
          <span class="slider round"></span>
        </label>
      </div>

      <div class="setting-item">
        <div class="setting-info">
          <div class="setting-label">左键长按判定延迟 (毫秒)</div>
          <div class="setting-desc">按下多久后判定为长按 (默认 280ms)</div>
        </div>
        <input type="number" id="mouseLongPressDelayInput" class="small-input" step="10" min="50" max="2000" placeholder="280">
      </div>

      <div class="setting-item no-border">
        <div class="setting-info">
          <div class="setting-label">长按加速倍率</div>
          <div class="setting-desc">键盘 → 键或鼠标左键长按时的播放速度</div>
        </div>
        <input type="number" id="longPressInput" class="small-input" step="0.5" min="0.5" max="16.0" placeholder="3.0">
      </div>
    </div>
  </div>
</main>

<footer>
  <!-- 倍速管理页的操作按钮 -->
  <div class="btn-group" id="speedFooter">
    <button id="resetBtn" class="secondary-btn">恢复默认</button>
    <button id="saveBtn" class="primary-btn">保存倍速并应用</button>
  </div>

  <!-- 倍速设置页的操作按钮 -->
  <div class="btn-group hidden" id="speedSettingsFooter">
    <button id="saveSpeedSettingsBtn" class="primary-btn">保存设置</button>
  </div>

  <!-- 手势页的操作按钮 -->
  <div class="btn-group hidden" id="gestureFooter">
    <button id="saveSettingBtn" class="primary-btn">保存手势设置</button>
  </div>

  <div id="status"></div>
</footer>

<script src="popup.js"></script>
</body>
</html>
